name: Deploy demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TypeScript loader
        run: |
          cd npm/chaza
          npm ci || npm install
          npm run build

      - name: Build CLI
        run: zig build

      - name: Build demo bundle
        run: |
          ./zig-out/bin/chaza build bench/corpus.json -o demo/chaza.bundle --config demo/chaza.json
          cp npm/chaza/dist/chaza.js demo/chaza.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
